<div class="faixa" aria-label="Vantagens da Inovou Store">
  <div class="faixa__trilho">
    <ul class="faixa__lista">
      @for (beneficio of beneficios; track beneficio.texto) {
        <li class="faixa__item">
          <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">{{
            beneficio.icone
          }}</mat-icon>
          {{ beneficio.texto }}
        </li>
      }
    </ul>
    <ul class="faixa__lista faixa__lista--copia" aria-hidden="true">
      @for (beneficio of beneficios; track beneficio.texto) {
        <li class="faixa__item">
          <mat-icon fontSet="material-symbols-outlined">{{ beneficio.icone }}</mat-icon>
          {{ beneficio.texto }}
        </li>
      }
    </ul>
  </div>
</div>
