<article class="card" [class.card--esgotado]="!produto().disponivel">
  @if (!produto().disponivel) {
    <span class="card__selo">Esgotado</span>
  }
  <a
    [routerLink]="['/produtos', produto().slug]"
    class="card__imagem"
    tabindex="-1"
    aria-hidden="true"
  >
    @if (produto().imagemPrincipal; as imagem) {
      <img [src]="imagem" alt="" loading="lazy" />
    } @else {
      <img class="card__sem-foto" src="marca-iv.png" alt="" loading="lazy" />
    }
  </a>
  <div class="card__corpo">
    <span class="card__categoria">{{ produto().categoria.nome }}</span>
    <a [routerLink]="['/produtos', produto().slug]" class="card__nome">{{ produto().nome }}</a>
    <div class="card__valores">
      <span class="card__preco">{{ produto().preco | currency }}</span>
    </div>
    @if (produto().disponivel) {
      <button type="button" class="card__acao" [disabled]="adicionando()" (click)="adicionar()">
        <mat-icon fontSet="material-symbols-outlined" aria-hidden="true">shopping_cart</mat-icon>
        {{ adicionando() ? 'Adicionando...' : 'Adicionar' }}
      </button>
    } @else {
      <a [routerLink]="['/produtos', produto().slug]" class="card__acao card__acao--detalhes">
        Ver detalhes
      </a>
    }
  </div>
</article>
