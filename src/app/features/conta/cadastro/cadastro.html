<section class="pagina-estreita">
  <div class="cartao">
    <h1 class="cartao__titulo">Criar conta</h1>
    <p class="cartao__subtitulo">Leva menos de um minuto.</p>

    @if (erro(); as mensagem) {
      <div class="alerta" role="alert">{{ mensagem }}</div>
    }

    <form class="formulario" [formGroup]="formulario" (ngSubmit)="cadastrar()" novalidate>
      <label class="campo">
        <span>Nome completo</span>
        <input type="text" formControlName="nome" autocomplete="name" />
        @if (invalido('nome')) {
          <small class="campo__erro">Informe seu nome (mínimo 2 letras).</small>
        } @else if (errosServidor()['nome']; as mensagem) {
          <small class="campo__erro">{{ mensagem }}</small>
        }
      </label>

      <label class="campo">
        <span>E-mail</span>
        <input type="email" formControlName="email" autocomplete="email" />
        @if (invalido('email')) {
          <small class="campo__erro">Informe um e-mail válido.</small>
        } @else if (errosServidor()['email']; as mensagem) {
          <small class="campo__erro">{{ mensagem }}</small>
        }
      </label>

      <label class="campo">
        <span>Senha</span>
        <input type="password" formControlName="senha" autocomplete="new-password" />
        @if (invalido('senha')) {
          <small class="campo__erro">A senha deve ter entre 8 e 72 caracteres.</small>
        } @else {
          <small class="campo__dica">Mínimo de 8 caracteres.</small>
        }
      </label>

      <label class="campo">
        <span>Confirmar senha</span>
        <input type="password" formControlName="confirmacao" autocomplete="new-password" />
        @if (invalido('confirmacao')) {
          <small class="campo__erro">Repita a senha.</small>
        } @else if (senhasDiferentes()) {
          <small class="campo__erro">As senhas não são iguais.</small>
        }
      </label>

      <button type="submit" class="botao botao--primario botao--largo" [disabled]="enviando()">
        {{ enviando() ? 'Criando conta...' : 'Criar conta' }}
      </button>
    </form>

    <p class="cartao__rodape">
      Já tem conta?
      <a routerLink="/entrar" [queryParams]="{ retorno: retorno() }">Entrar</a>
    </p>
  </div>
</section>
